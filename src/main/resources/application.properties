spring.application.name=planificador-eventos-backend

# --- Servidor ---
server.port=${PORT:8080}

# --- CORS (orígenes permitidos, separados por coma) ---
app.cors.allowed-origins=https://*.vercel.app,http://localhost:5173

# --- DataSource Supabase/PostgreSQL (valores desde .env o env vars) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# --- Pool de conexiones HikariCP ---
spring.datasource.hikari.pool-name=PlanificadorPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=1

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- springdoc OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html