spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Seguridad (US-11) ---
# Secreto de pruebas: nunca reused en producción, solo habilita la cadena para
# que los tests ejerciten JwtService, el filtro y el entry point de verdad.
app.security.jwt.secret=secreto-de-pruebas-us11-minimo-32-caracteres
app.security.jwt.expiration-seconds=3600
app.security.jwt.issuer=planificador-eventos-backend-test

# Las 109 pruebas existentes llaman /api/subtareas y /api/eventos sin token.
# Con la protección activa se validan en JwtSecurityIntegrationTest, que
# arranca su propio contexto con la bandera en true.
app.security.protect-subtareas=false
app.security.legacy-user-id=1
