services:
  - type: web
    name: planificador-eventos-backend
    runtime: docker
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require&options=-c%20pooler_session_mode%3Dtransaction
      - key: DB_USER
        value: postgres.akyvplcsiqhmfkqxvgoq
      - key: DB_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60
      # US-11 · El servicio NO arranca sin este valor. Mínimo 32 caracteres.
      # Generar: openssl rand -base64 48. Fijar a mano en el dashboard de Render.
      - key: JWT_SECRET
        sync: false
      # Caducidad del token en segundos (8 horas).
      - key: JWT_EXPIRATION_SECONDS
        value: "28800"
      # Interruptor de US-11. Dejar en false hasta que el frontend deployed
      # envíe Authorization: Bearer; después subir a true desde el dashboard.
      - key: PROTECT_SUBTAREAS
        value: "false"
      # Usuario legado, solo se usa mientras PROTECT_SUBTAREAS=false.
      - key: LEGACY_USER_ID
        value: "1"
